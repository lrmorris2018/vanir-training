<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vanir National Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy-2:#1C2B4D; --ink:#1B1E25; --paper:#F7F6F2; --paper-2:#EDEBE4;
  --slate:#5B6472; --line:#D7D4CB; --orange:#E8700A; --orange-ink:#8C3F00; --orange-bg:#FFF1E4;
  --green:#2E7D4F; --green-bg:#E6F2EA; --red:#B3261E; --red-bg:#FBE9E7;
  --bg:var(--paper); --surface:#FFFFFF; --text:var(--ink); --muted:var(--slate);
  --rail:var(--navy); --rail-text:#DCE3F2; --rail-muted:#8E9BB8;
  --head:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121722; --surface:#1A2130; --text:#ECEEF3; --muted:#A3ACBD; --line:#2C3547; --paper-2:#202839;
    --rail:#0C1120; --orange-bg:#3A2410; --orange-ink:#FFB376; --green-bg:#163322; --red-bg:#3A1B19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121722; --surface:#1A2130; --text:#ECEEF3; --muted:#A3ACBD; --line:#2C3547; --paper-2:#202839;
  --rail:#0C1120; --orange-bg:#3A2410; --orange-ink:#FFB376; --green-bg:#163322; --red-bg:#3A1B19;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.05;margin:0;letter-spacing:-.005em}

/* layout */
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:100%;height:100%;overflow:hidden}
.rail{background:var(--rail);color:var(--rail-text);padding:28px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--head);font-size:26px;font-weight:700;color:#fff;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--rail-muted);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;color:var(--rail-text);font-size:15px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.locked{opacity:.45;cursor:not-allowed}
.nav button.locked:hover{background:none}
.nav button.active{background:rgba(255,255,255,.12);color:#fff}
.nav button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.nav .tag{margin-left:auto;font-size:12px;font-weight:600;color:var(--rail-muted)}
.nav .tag.pass{color:#7FD39A}
.nav .tag.fail{color:#FF9A94}
.nav .day-n{font-family:var(--head);font-size:17px;width:22px;color:var(--rail-muted)}
.nav button.active .day-n{color:var(--orange)}
.rail-foot{margin-top:auto;font-size:13px;color:var(--rail-muted);line-height:1.45}
.rail-foot button{background:none;border:1px solid rgba(255,255,255,.2);border-radius:6px;color:var(--rail-text);padding:6px 10px;font-size:13px;margin-top:10px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 36px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.topbar .where{font-weight:600;color:var(--text)}
.topbar .counter{margin-left:auto;font-variant-numeric:tabular-nums}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.stage{flex:1;overflow-y:auto;padding:40px 36px 120px}
.slide{max-width:860px;margin:0 auto}
.slide h2{font-size:clamp(34px,4.4vw,52px);margin-bottom:18px}
.slide h3{font-size:24px;margin:28px 0 10px}
.slide p{margin:0 0 14px;max-width:70ch}
.slide ul,.slide ol{margin:0 0 16px;padding-left:22px;max-width:72ch}
.slide li{margin:0 0 8px}
.kicker{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:8px}
.lead{font-size:20px;color:var(--text);max-width:64ch}

table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0 18px;background:var(--surface)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:14px}
.scroll{overflow-x:auto;max-width:100%}

/* fraud emphasis: hazard stripe */
.hazard{position:relative;background:var(--orange-bg);border-radius:8px;padding:22px 24px 22px 34px;margin:22px 0;color:var(--text)}
.hazard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;border-radius:8px 0 0 8px;
  background:repeating-linear-gradient(135deg,var(--orange) 0 10px,var(--navy) 10px 20px)}
.hazard h3{margin-top:0;color:var(--orange-ink);font-size:26px}
.hazard p:last-child{margin-bottom:0}
.hazard.big h3{font-size:clamp(28px,3.6vw,40px)}
.callout{border-left:4px solid var(--navy);padding:12px 18px;background:var(--surface);border-radius:0 6px 6px 0;margin:16px 0}
.callout.good{border-color:var(--green);background:var(--green-bg)}
.callout.bad{border-color:var(--red);background:var(--red-bg)}

/* nav buttons */
.slidenav{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:16px 36px;border-top:1px solid var(--line);background:var(--bg)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:11px 20px;font-weight:600;font-size:15px}
.btn:hover{background:var(--navy-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper-2)}
.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--navy)}
.dots i.done{background:var(--muted)}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin:0 0 16px}
.q .qn{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}
.q .qt{font-weight:600;font-size:18px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:11px 14px;width:100%}
.opt:hover{border-color:var(--navy)}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt .k{font-family:var(--head);font-weight:700;font-size:18px;min-width:18px;color:var(--muted)}
.exp{margin-top:12px;font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:26px 28px;margin:10px 0 20px}
.score .big{font-family:var(--head);font-size:64px;font-weight:700;line-height:1}
.score.pass .big{color:var(--green)}
.score.fail .big{color:var(--red)}

/* carrier profile cards */
.profile{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0 26px}
.profile .ph{display:flex;justify-content:space-between;gap:16px;padding:16px 20px;background:var(--navy);color:#fff}
.profile .ph .nm{font-family:var(--head);font-size:26px;font-weight:700;line-height:1.05}
.profile .ph .dba{font-size:13px;color:#C4CEE4;margin-top:4px}
.profile .ph .ids{text-align:right;font-size:13px;color:#C4CEE4;line-height:1.5}
.profile .ph .ids b{color:#fff;font-size:16px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pcell{padding:14px 20px;border-bottom:1px solid var(--line)}
.pcell:nth-child(odd){border-right:1px solid var(--line)}
.pcell .lab{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.pcell .val{font-size:15px}
.pcell .val.warn{color:var(--orange-ink);font-weight:600}
.pcell.wide{grid-column:1/-1;border-right:0}
.fg{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0;font-size:14px}
.fg b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.decide{display:flex;gap:10px;padding:16px 20px;flex-wrap:wrap;align-items:center}
.decide .btn.approve{background:var(--green)}
.decide .btn.decline{background:var(--red)}
.decide .btn:disabled{opacity:.55;cursor:default}
.decide .btn.chosen{outline:3px solid var(--navy);outline-offset:2px;opacity:1}
.verdict{padding:0 20px 18px}
.mock{font-size:12px;color:var(--muted);padding:8px 20px;border-top:1px dashed var(--line)}

/* equipment gallery */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:18px 0}
.eqc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px}
.eqi svg{width:100%;height:auto;display:block}
.eqn{font-family:var(--head);font-size:22px;font-weight:700;margin-top:6px}
.eqs{font-size:14px;color:var(--muted);margin-top:2px}

/* schedule tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.tile .d{font-family:var(--head);font-size:30px;font-weight:700;line-height:1}
.tile .t{font-weight:600;margin-top:6px}
.tile .s{font-size:13px;color:var(--muted);margin-top:4px}
.tile.fraud{border-color:var(--orange);background:var(--orange-bg)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);transform:translateX(-100%);transition:transform .2s;z-index:20;padding-top:calc(28px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .menu-btn{display:inline-block}
  .topbar,.stage,.slidenav{padding-left:18px;padding-right:18px}
  .pgrid{grid-template-columns:1fr}
  .pcell:nth-child(odd){border-right:0}
  .profile .ph{flex-direction:column}
  .profile .ph .ids{text-align:left}
}
@media (prefers-reduced-motion: reduce){ .rail{transition:none} }
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
.scrim.open{display:block}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">Vanir National<small>Freight broker course · 6 days</small></div>
    <nav class="nav" id="nav" aria-label="Course sections"></nav>
    <div class="rail-foot">Progress saves in this browser. Use ← → keys to move between slides.
      <br><button id="resetBtn">Reset my progress</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open course menu">Menu</button>
      <span class="where" id="where"></span>
      <span class="counter" id="counter"></span>
    </div>
    <div class="stage" id="stage"><div class="slide" id="slide"></div></div>
    <div class="slidenav">
      <button class="btn ghost" id="prevBtn">Back</button>
      <div class="dots" id="dots"></div>
      <button class="btn" id="nextBtn">Next</button>
    </div>
  </div>
</div>
<script>
// ---------- COURSE CONTENT ----------
const COURSE = [];

// ---------- EQUIPMENT ILLUSTRATIONS (inline SVG, side profile, facing right) ----------
const W=(x,y,r=11)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#1B1E25"/><circle cx="${x}" cy="${y}" r="${r*0.45}" fill="#9AA3B2"/>`;
const TRACTOR=(x=150)=>`<rect x="${x}" y="38" width="46" height="42" rx="4" fill="var(--navy)"/><rect x="${x+46}" y="58" width="34" height="22" rx="3" fill="var(--navy)"/><rect x="${x+8}" y="44" width="24" height="16" rx="2" fill="#B8D0F0"/><rect x="${x-6}" y="78" width="90" height="6" fill="#3A4150"/>${W(x+10,86)}${W(x+66,86)}`;
const TRAILER_BOX=(x=12,w=134,color="#E4E1D8")=>`<rect x="${x}" y="28" width="${w}" height="52" rx="2" fill="${color}" stroke="#8E95A3"/><rect x="${x+4}" y="78" width="${w-8}" height="6" fill="#3A4150"/>${W(x+22,86)}${W(x+46,86)}`;
const GROUND=`<line x1="0" y1="98" x2="240" y2="98" stroke="#8E95A3" stroke-width="1.5"/>`;
const SVG=(inner,label)=>`<svg viewBox="0 0 240 104" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${inner}${GROUND}</svg>`;
const EQ={
  van: SVG(TRAILER_BOX()+TRACTOR(), "Dry van: 53-foot enclosed trailer"),
  reefer: SVG(TRAILER_BOX(12,134,"#F3F6FA")+`<rect x="140" y="32" width="10" height="22" rx="1" fill="#4A5568"/><text x="70" y="60" font-size="18" text-anchor="middle" fill="#4A6FA5" font-family="Arial">❆</text>`+TRACTOR(), "Reefer: insulated trailer with a cooling unit on the nose"),
  flatbed: SVG(`<rect x="12" y="72" width="138" height="8" fill="#8E95A3"/><rect x="16" y="78" width="130" height="6" fill="#3A4150"/>${W(34,86)}${W(58,86)}<circle cx="50" cy="58" r="14" fill="#6B7280"/><circle cx="50" cy="58" r="5" fill="#E4E1D8"/><circle cx="84" cy="58" r="14" fill="#6B7280"/><circle cx="84" cy="58" r="5" fill="#E4E1D8"/><circle cx="118" cy="58" r="14" fill="#6B7280"/><circle cx="118" cy="58" r="5" fill="#E4E1D8"/>`+TRACTOR(), "Flatbed: open deck, here loaded with steel coils"),
  stepdeck: SVG(`<rect x="112" y="52" width="38" height="8" fill="#8E95A3"/><rect x="12" y="66" width="100" height="8" fill="#8E95A3"/><rect x="110" y="52" width="4" height="22" fill="#8E95A3"/><rect x="16" y="78" width="80" height="6" fill="#3A4150"/>${W(34,86)}${W(58,86)}<rect x="24" y="18" width="60" height="48" rx="3" fill="#C9A227"/><rect x="30" y="8" width="20" height="12" fill="#C9A227"/>`+TRACTOR(), "Step deck: upper front deck, lower rear deck for tall freight"),
  poweronly: SVG(`<rect x="28" y="38" width="46" height="42" rx="4" fill="var(--navy)"/><rect x="74" y="58" width="34" height="22" rx="3" fill="var(--navy)"/><rect x="36" y="44" width="24" height="16" rx="2" fill="#B8D0F0"/><rect x="0" y="78" width="112" height="6" fill="#3A4150"/><rect x="4" y="70" width="22" height="8" fill="#3A4150"/>${W(14,86)}${W(94,86)}<text x="165" y="64" font-size="13" fill="var(--muted)" font-family="Arial">no trailer</text>`, "Power only: tractor without a trailer"),
  hotshot: SVG(`<rect x="8" y="66" width="96" height="8" fill="#8E95A3"/><rect x="104" y="44" width="4" height="30" fill="#8E95A3"/><rect x="108" y="44" width="30" height="4" fill="#8E95A3"/>${W(36,86,9)}${W(58,86,9)}<rect x="16" y="46" width="36" height="20" fill="#C9A227"/><rect x="136" y="46" width="44" height="28" rx="2" fill="var(--navy)"/><rect x="180" y="60" width="40" height="14" rx="2" fill="var(--navy)"/><rect x="142" y="50" width="22" height="12" rx="2" fill="#B8D0F0"/><rect x="130" y="74" width="96" height="4" fill="#3A4150"/>${W(154,86,9)}${W(206,86,9)}`, "Hotshot: pickup truck pulling a gooseneck trailer"),
  boxtruck: SVG(`<rect x="60" y="32" width="100" height="48" rx="2" fill="#E4E1D8" stroke="#8E95A3"/><rect x="160" y="46" width="40" height="34" rx="4" fill="var(--navy)"/><rect x="168" y="50" width="22" height="14" rx="2" fill="#B8D0F0"/><rect x="56" y="78" width="150" height="6" fill="#3A4150"/>${W(90,86,10)}${W(184,86,10)}<rect x="60" y="70" width="6" height="14" fill="#3A4150"/>`, "Box truck: straight truck with the cargo box on the same chassis")
};
const eqCard=(k,name,sub)=>`<div class="eqc"><div class="eqi">${EQ[k]}</div><div class="eqn">${name}</div><div class="eqs">${sub}</div></div>`;

COURSE.push({
  id:"start", label:"Start here", short:"Start",
  slides:[
    {h:"Welcome to the Vanir National broker course", k:"Six days, six quizzes, one final exam", html:`
      <p class="lead">This course takes you from zero freight knowledge to booking your first supervised load. Each day ends with a short quiz; the course ends with a 34-question final. You need 85% on each day’s quiz to unlock the next day, and 85% on the final to graduate.</p>
      <div class="tiles">
        <div class="tile"><div class="d">1</div><div class="t">How freight works</div><div class="s">Parties, margin, the broker’s job</div></div>
        <div class="tile"><div class="d">2</div><div class="t">Equipment and modes</div><div class="s">Vans, reefers, flatbeds, LTL class</div></div>
        <div class="tile fraud"><div class="d">3</div><div class="t">Fraud and carrier vetting</div><div class="s">The day that protects the money</div></div>
        <div class="tile"><div class="d">4</div><div class="t">Pricing and posting</div><div class="s">DAT RateView, margin, what to post</div></div>
        <div class="tile"><div class="d">5</div><div class="t">Running the load</div><div class="s">Dispatch, tracking, paperwork, billing</div></div>
        <div class="tile"><div class="d">6</div><div class="t">Landing shippers</div><div class="s">Sourcing, the sales cycle, follow-up</div></div>
      </div>
      <div class="hazard big"><h3>Read this before anything else</h3>
        <p>Freight fraud is the fastest way to lose Vanir National’s money and your job. Double brokering, carrier identity theft and stolen loads cost the industry hundreds of millions of dollars a year, and new brokers are the preferred target because they are eager to cover a load and slow to say no.</p>
        <p>No carrier gets dispatched until the vetting checklist is complete. Not “mostly done.” Complete. If a senior broker is not available to sign off, the load waits.</p></div>`},
    {h:"How to use this course", html:`
      <ul>
        <li>Move through slides with the Next button or the arrow keys. Days unlock in order: the next day opens only after you pass the current day’s quiz.</li>
        <li>Each quiz draws 8 questions from a pool of 25. It grades instantly and explains every answer. You need 85% to move on; if you miss, you retake with a fresh set of questions.</li>
        <li>Day 3 includes a carrier screening lab: seven mock carrier profiles laid out the way a vetting tool shows them. You decide approve or decline, and the course grades your reasoning.</li>
        <li>The final exam unlocks after all six quizzes are passed. It covers everything, and fraud and vetting questions are weighted heaviest.</li>
        <li>Your progress saves in this browser. Your trainer will ask to see your final score screen.</li>
      </ul>
      <div class="callout">Trainer note: the mock carrier profiles are fictional. Before the live class, pull three real carriers from your Carrier411 account (one clean, one with lapsed insurance, one with FreightGuard reports) and screen them together on a shared screen.</div>`}
  ]
});

COURSE.push({
  id:"day1", label:"How freight works", short:"Day 1", day:1,
  slides:[
    {h:"What a freight broker actually does", k:"Day 1", html:`
      <p class="lead">A broker matches a shipper who has freight with a carrier who has a truck, and gets paid for making the match happen reliably. We own no trucks. We never touch the freight. What we sell is coverage, communication and trust.</p>
      <p>Roughly 70% of US freight tonnage moves by truck. Most of what Vanir National handles is full truckload: one shipper, one truck, origin to destination.</p>`},
    {h:"The five parties on every load", html:`
      <table><tr><th>Party</th><th>Who they are</th><th>What they want from you</th></tr>
      <tr><td>Shipper</td><td>Owns the freight, pays Vanir National</td><td>A truck that shows up, a fair rate, no surprises</td></tr>
      <tr><td>Consignee</td><td>Receives the freight</td><td>On-time delivery, correct paperwork</td></tr>
      <tr><td>Carrier</td><td>The trucking company, often 1 to 10 trucks</td><td>A fair rate, fast pay, honest load details</td></tr>
      <tr><td>Driver</td><td>The person doing the work</td><td>Accurate appointment times, a phone that gets answered</td></tr>
      <tr><td>Broker (us)</td><td>Arranges the carrier; legally an arranger, not a carrier</td><td>Margin and repeat business</td></tr></table>
      <p>Learn to think from the carrier’s side. A small carrier worries about fuel, hours of service and getting paid. Brokers who understand that negotiate better and burn fewer bridges.</p>`},
    {h:"How we make money", html:`
      <p class="lead">Three numbers live on every load: the customer rate, the carrier rate, and the difference, which is gross margin.</p>
      <table><tr><th>Line</th><th>Example</th></tr>
      <tr><td>Customer rate (shipper pays us)</td><td>$2,400</td></tr>
      <tr><td>Carrier rate (we pay the truck)</td><td>$2,050</td></tr>
      <tr><td>Gross margin</td><td>$350, which is 14.6% of the customer rate</td></tr></table>
      <p>Industry average margin runs 12 to 18%. Your trainer will give you Vanir National’s floor and target. Margin as a percentage is always calculated against the customer rate.</p>

    {h:"Broker, carrier, 3PL, dispatcher", html:`
      <p>Shippers and carriers will ask what you are. Have one sentence for each.</p>
      <ul>
        <li><strong>Asset carrier:</strong> owns trucks and hauls freight with its own drivers.</li>
        <li><strong>Freight broker:</strong> licensed by FMCSA, arranges carriers for shippers, holds a $75,000 bond, owns no trucks.</li>
        <li><strong>3PL:</strong> a broader logistics provider that may also run warehouses, manage a shipper’s whole transportation program, or both. Many 3PLs have a brokerage inside them.</li>
        <li><strong>Dispatcher:</strong> works for the carrier, finding loads for its trucks. Not licensed as a broker; cannot legally arrange freight for a shipper.</li>
      </ul>
      <p>Why it matters: a “carrier” who turns out to be a dispatcher or an unlicensed broker is a double-brokering risk. You will learn to spot this on Day 3.</p>`},

        <li><strong>7:00 to 8:00</strong> Check every load in transit. Confirm drivers are rolling. Send status to customers before they ask.</li>
        <li><strong>8:00 to 10:00</strong> Cover open loads for today and tomorrow. The best trucks are booked by 10 a.m.</li>

        <li><strong>3:00 to 5:00</strong> Delivery confirmations, collect PODs, set up tomorrow’s dispatches, final check calls.</li>
      </ol>
      <p>The habit that separates brokers who last from brokers who wash out is the 10-to-12 prospecting block. Protect it.</p>`}

  slides:[
    {h:"The day that protects the money", k:"Day 3", html:`
      <div class="hazard big"><h3>Nobody books a carrier until this day is passed</h3>
        <p>Every other skill in this course makes a broker money. This one keeps it. A single double-brokered load can cost a broker $30,000 to $150,000 in stolen freight, a lost customer, and legal exposure. Scammers target new brokers specifically because new brokers want to cover the load and do not yet know what wrong looks like.</p>
        <p>By the end of today you will be able to vet a carrier end to end, recognize the four common fraud patterns on sight, and pass the screening lab.</p></div>`},
    {h:"Regulatory basics", html:`
      <ul>
        <li><strong>FMCSA</strong> issues operating authority (the MC number) and the USDOT number. A carrier needs active authority, a BOC-3 process agent on file, and insurance on file.</li>
        <li><strong>Brokers</strong> need their own authority, a $75,000 surety bond (BMC-84) or trust (BMC-85), and a signed broker-carrier agreement with every carrier they use.</li>
        <li><strong>Insurance minimums:</strong> $750,000 auto liability is the federal floor. Vanir National and most shippers require $1,000,000 auto and $100,000 cargo. Reefer freight needs reefer breakdown coverage.</li>
        <li><strong>Safety data:</strong> FMCSA SAFER and SMS show inspections, out-of-service rates, crashes and the safety rating. Conditional or Unsatisfactory is a hard stop.</li>
      </ul>`},
    {h:"The four fraud patterns", html:`
      <div class="hazard"><h3>1. Double brokering</h3><p>The carrier you booked re-brokers your load to another carrier, usually at a lower rate, and often does not pay them. You lose control of the freight; the second carrier may hold it hostage; you may end up paying twice. Signs: a “carrier” with no trucks of their own, a different truck than the one on the rate con showing up at the dock, a driver who does not know the company name you booked.</p></div>
      <div class="hazard"><h3>2. Carrier identity theft</h3><p>A scammer uses a real carrier’s MC number with a spoofed email and phone. The real carrier never knows. The freight is loaded on the scammer’s truck and disappears. Signs: contact info that does not match FMCSA, a free email domain, a callback number that is not the one on file, urgency.</p></div>
      <div class="hazard"><h3>3. New authority or recently changed profile</h3><p>Authority under 6 months old (Vanir National’s minimum), recently reinstated authority, a mail-drop address, or a change of address, phone or officer in the last 30 days. Any one is a yellow flag. Two or more together is the fraud profile.</p></div>
      <div class="hazard"><h3>4. Load board phishing</h3><p>Scammers scrape your postings and call claiming to be the carrier that “already booked it,” or email a fake rate con for signature to harvest your details. Only one carrier gets your rate con, and you send it to the FMCSA-listed email.</p></div>`},
    {h:"The vetting checklist, every carrier, every time", html:`
      <ol>
        <li>MC and USDOT active on FMCSA; authority at least 6 months old (Vanir National minimum, no exceptions)</li>
        <li>Safety rating Satisfactory or None, never Conditional or Unsatisfactory</li>
        <li>COI verified by calling the insurance agent; $1M auto and $100K cargo minimum, and not cancelled</li>
        <li>Phone and email match FMCSA records; callback completed on the FMCSA number</li>
        <li>No fraud reports in the monitoring tool</li>
        <li>Signed broker-carrier agreement and W-9 on file</li>
        <li>Driver name, truck number and trailer number collected before dispatch</li>
        <li>Equipment matches the load</li>
      </ol>
      <div class="hazard"><h3>The one rule that catches most identity theft</h3><p>Never call back on the number the caller gave you. Call the number listed on FMCSA. If the caller resists that, you have your answer.</p></div>`},
    {h:"Vetting in Carrier411: what to read, in order", html:`
      <ol>
        <li><strong>Search by MC or DOT, never by name.</strong> Confirm legal name, DBA and address match what the caller said.</li>
        <li><strong>Authority status and age.</strong> Vanir National requires a carrier to have been in business at least 6 months. In Carrier411, open the Authority section of the carrier’s profile. It lists common, contract and broker authority with the date each was granted, plus any revocations and reinstatements. Count the 6 months from the date the MC authority was <em>granted</em>, not from when the company was formed or the USDOT number was issued; those can be years older than the authority. If the authority was revoked and later reinstated, the clock restarts at the reinstatement date. A carrier that passes everything else but is 5 months old waits.</li>
        <li><strong>Insurance.</strong> Auto liability and cargo amounts, insurer, effective and cancellation dates. Missing or cancelled cargo coverage is a stop. Then call the agent; filings lag.</li>
        <li><strong>Safety.</strong> Driver OOS vs. national average (about 5 to 6%); vehicle OOS vs. about 20 to 22%. Double the average is a decline for valuable or reefer freight.</li>
        <li><strong>FreightGuard reports.</strong> Incident reports from other brokers. Read the carrier’s rebuttal too. One old report with a credible response can be fine. Any double-brokering, theft or hostage report, or multiple reports, is an automatic decline.</li>
        <li><strong>Contact info vs. caller.</strong> Phone and email on file vs. the phone and email in front of you.</li>
        <li><strong>Recent changes.</strong> Address, phone, email, officer in the last 30 days.</li>
        <li><strong>Add to monitoring, then document the check in the TMS.</strong></li>
      </ol>
      <p>The next slides are the screening lab. Seven profiles, laid out the way a vetting tool shows them. Decide approve or decline on each; the course grades you.</p>`},

COURSE.push({
  id:"day4", label:"Pricing and posting", short:"Day 4", day:4,
  slides:[
    {h:"Two numbers, two decisions", k:"Day 4", html:`
      <p class="lead">Every load has a customer rate and a carrier rate. They are set by different logic. The customer rate is what the market and your margin target say the shipper should pay. The posted rate is a tactical number chosen to get the phone to ring at the right price.</p>
      <p>Today you learn to pull a lane in DAT RateView, adjust it for the real world, build a quote, and decide what to post.</p>`},
    {h:"What moves the carrier rate", html:`
      <ul>
        <li><strong>Direction.</strong> Outbound from freight-rich markets (Chicago, Dallas, Atlanta) is cheap. Outbound from freight-poor markets (Florida, Denver, the Northeast) is expensive because the truck has to come back empty.</li>
        <li><strong>Equipment.</strong> Reefer and flatbed run 15 to 30% above dry van.</li>
        <li><strong>Timing.</strong> Same-day freight, end of month and produce season each add 5 to 15%. Monday and Friday pickups typically run cheaper: trucks are repositioning after the weekend and hunting for a load to get home before it.</li>
        <li><strong>Freight details.</strong> Multi-stop, driver assist, residential, hazmat, long dwell at the shipper.</li>
        <li><strong>Fuel.</strong> Rates are quoted all-in or linehaul plus a fuel surcharge tied to the DOE weekly diesel index.</li>
        <li><strong>Market cycle.</strong> In a tight market carriers reject contract freight for spot; in a soft market shippers push loads to the spot board. Know which one you are in.</li>
      </ul>`},
    {h:"Pricing a lane in DAT RateView", html:`
      <ol>
        <li><strong>Enter the lane and equipment.</strong> Origin, destination, van/reefer/flatbed. Rates are by market area, not exact town.</li>
        <li><strong>Pick the timeframe.</strong> 7-day and 15-day for freight moving this week. If the 7-day is well above the 30-day, the market is tightening; price high.</li>
        <li><strong>Read the three numbers.</strong> Average rate per mile, the low-to-high range, and the all-in total. The average is where a reasonable carrier books; the high end is what you pay when trucks are scarce.</li>
        <li><strong>Check the sample size.</strong> Under about 10 reports, the number is unreliable. Widen the area or lean on Vanir National’s own lane history.</li>
        <li><strong>Separate linehaul from fuel.</strong> Know which the customer expects.</li>
        <li><strong>Adjust</strong> for direction, day of week, freight details and season (previous slide).</li>
        <li><strong>Build the quote.</strong> Adjusted carrier cost plus Vanir National’s margin target, rounded clean. Write one sentence in the notes explaining the number.</li>
        <li><strong>Cross-check</strong> against TMS history and the load board rate insight. Disagreement over 10% means find out why before quoting.</li>
      </ol>
      <div class="callout">RateView tells you what the truck costs. It does not tell you what to charge the shipper. Your margin target does that.</div>`},
    {h:"Knowing what rate to post", html:`
      <ol>
        <li><strong>Start at the RateView average</strong> for the lane and timeframe.</li>
        <li><strong>Check truck-to-load ratio.</strong> Over 3 loads per truck: carriers have leverage, post at or above average. Under 1: trucks are hunting, post 5 to 10% under and let them come to you.</li>
        <li><strong>Post a rate or leave it blank?</strong> A posted rate filters out carriers who will not take it. A blank gets more calls and lets you anchor live. Tight market: post it. Soft market: consider leaving it off.</li>
        <li><strong>Post below your walk-away.</strong> Max carrier pay = customer rate minus margin floor. Post 5 to 10% below that so you have room to move.</li>
        <li><strong>Post early and refresh.</strong> Next-day freight posted by 7 a.m., refreshed every 30 to 60 minutes. Call preferred carriers before relying on the board.</li>
        <li><strong>Read the response.</strong> No calls in 45 minutes on next-day freight: too low, raise in $50 to $100 steps. Fifteen calls in ten minutes: you overpaid, book a vetted carrier fast and note the lane.</li>
        <li><strong>Firmness drops as the clock runs.</strong> 24 hours out, hold your number. 4 hours out, pay the market.</li>
      </ol>`},
    {h:"Worked example", html:`
      <p class="lead">Dry van, Atlanta to Jacksonville, 350 miles, Thursday pickup, Friday delivery.</p>
      <table><tr><th>Step</th><th>Number</th></tr>
      <tr><td>RateView 7-day average</td><td>$2.05 per mile, $718 all-in; range $1.70 to $2.45</td></tr>
      <tr><td>Adjustment</td><td>Atlanta outbound is a strong market; carrier should book near average. Estimated cost $725</td></tr>
      <tr><td>Customer quote at 15% target margin</td><td>$850</td></tr>
      <tr><td>Margin floor 10% → maximum carrier pay</td><td>$765</td></tr>
      <tr><td>Post at</td><td>$700; expect to book $700 to $750</td></tr>
      <tr><td>If no calls by 10 a.m.</td><td>Move to $740</td></tr></table>
      <p>The customer sees one number. You are managing three.</p>`},
    {h:"Negotiating with carriers", html:`
      <ul>
        <li>Confirm equipment, location and date before talking rate. Then name your number first, with a reason behind it: “I’ve got $1,850 on it, no-touch, drop at the receiver.” You set the anchor; the carrier reacts to it.</li>
        <li>Anchor low but credible. Insulting offers end the call and the relationship; a fair opening number with room to move gets the truck.</li>
        <li>Trade, do not concede: more money for a faster pickup, flexible delivery or quick pay.</li>
        <li>Sell the load: easy shipper, drop trailer, no-touch, good backhaul market.</li>
        <li>Know your walk-away before you dial. Silence after a number is a tool.</li>
        <li>Pay on time, answer the phone, never lie about the freight. Carriers talk to each other.</li>
      </ul>`}
  ],

    {h:"From the first call to the paid invoice", k:"Day 5", html:`
      <p class="lead">Today ties the week together: the 12 steps of a load, the operations rhythm, the five exceptions you will handle every month, and the paperwork that turns a delivered load into margin in the bank.</p>`},
    {h:"The 12 steps of a load", html:`
      <ol>
        <li><strong>Shipper request:</strong> origin, destination, dates, commodity, weight, equipment, special needs. Confirm every detail.</li>
        <li><strong>Quote</strong> in writing; get written acceptance or a PO number.</li>
        <li><strong>Load entry</strong> in the TMS. The TMS record is the single source of truth.</li>
        <li><strong>Post and source:</strong> preferred carriers first, then the board.</li>
        <li><strong>Negotiate and vet:</strong> rate, then the full checklist, then driver, truck and trailer numbers.</li>
        <li><strong>Rate confirmation</strong> signed and returned before dispatch. No signed rate con, no dispatch.</li>
        <li><strong>Dispatch:</strong> driver has pickup number, appointment time and contact. Tracking set.</li>
        <li><strong>Pickup:</strong> confirm loaded, piece count, seal number; photo of the signed BOL.</li>
        <li><strong>In transit:</strong> check calls or tracking twice a day minimum.</li>
        <li><strong>Delivery:</strong> confirm delivered; collect the signed POD; note any exceptions on it.</li>
        <li><strong>Carrier pay:</strong> invoice, BOL and POD verified against the rate con.</li>
        <li><strong>Customer invoice</strong> with POD attached; follow up on aging at 30 days.</li>
      </ol>`},
    {h:"Communicate before you are asked", html:`
      <p class="lead">The customer should never learn about a problem from their receiver. If a truck will be late, the customer hears it from Vanir National first, with a new ETA and a plan.</p>
      <p>Tracking options in order of reliability: ELD or telematics integration, tracking app (Macropoint, Trucker Tools, project44), driver check calls. Set the expectation in the rate con. A driver who will not track is a red flag.</p>
      <p>Every call, every ETA change, every promise goes in the TMS notes with a timestamp. Six weeks later, in a claim or a dispute, the notes are the only thing anyone believes.</p>`},
    {h:"The five exceptions", html:`
      <div class="scroll"><table><tr><th>Exception</th><th>First 10 minutes</th><th>Who pays</th></tr>
      <tr><td>Truck falls off</td><td>Repost higher, call preferred carriers, tell the customer the truth and a new ETA</td><td>Vanir National absorbs the increase unless the customer agrees to share</td></tr>
      <tr><td>Driver running late</td><td>Get the real ETA from the driver; notify receiver and customer; reschedule</td><td>Depends on cause; shipper-caused delay is billable</td></tr>
      <tr><td>Detention</td><td>Record in and out times on the BOL or a dock sign-off</td><td>Shipper or receiver, passed through to the carrier after free time (usually 2 hours)</td></tr>
      <tr><td>Breakdown</td><td>Confirm driver safety; location and repair ETA; decide repower vs. wait; update hourly</td><td>Original carrier covers recovery in most agreements</td></tr>
      <tr><td>Shortage or damage</td><td>Receiver notes specifics on the POD; photos; driver does not leave without a signed POD</td><td>Carrier’s cargo insurance via the claims process</td></tr></table></div>
      <p>Escalate immediately for cargo theft or fraud in progress, hazmat incidents, accidents, or a customer threatening to pull business.</p>`},
    {h:"Accessorials you must bill", html:`
      <div class="scroll"><table><tr><th>Accessorial</th><th>Typical charge</th><th>Proof required</th></tr>
      <tr><td>Detention</td><td>$50 to $100 per hour after 2 free hours</td><td>In/out times on BOL or dock sign-off</td></tr>
      <tr><td>Layover</td><td>$250 to $500 per night</td><td>Appointment confirmation showing the delay was not the carrier’s</td></tr>
      <tr><td>TONU</td><td>$150 to $350</td><td>Cancellation notice with timestamp</td></tr>
      <tr><td>Lumper</td><td>Pass-through at cost</td><td>Lumper receipt</td></tr>
      <tr><td>Driver assist</td><td>$75 to $200</td><td>On rate con or approved in writing</td></tr>
      <tr><td>Extra stop</td><td>$75 to $150 per stop</td><td>Rate con</td></tr></table></div>
      <p>An accessorial not agreed in writing before the load moves is a fight afterward. Put standard terms on every rate con and every customer quote.</p>`},
    {h:"Claims and paying the right party", html:`
      <p><strong>Cargo claims (Carmack Amendment):</strong> the carrier is liable from pickup to delivery unless they prove an exception. Receiver notes damage on the POD; broker notifies the carrier in writing within 24 hours; shipper files within 9 months with invoice value, photos and POD; carrier has 30 days to acknowledge and 120 days to resolve. Vanir National facilitates and documents; we do not pay out of pocket unless our contract says so.</p>
      <p><strong>Carrier pay:</strong> verify the invoice against the rate con, POD clean, no open claim. If the carrier factors, pay the factoring company per the notice of assignment, never the carrier directly. Paying the wrong party means paying twice.</p>
      <p><strong>Collections:</strong> invoice same day as POD with POD attached. 30-day reminder, 45-day call, 60-day escalation. Credit-check new shippers before the first load; one $10,000 unpaid invoice erases the margin on 30 good loads.</p>`}

    {h:"Nothing happens until a shipper gives you a load", k:"Day 6", html:`
      <p class="lead">Everything you learned this week is worthless without freight to move. Today is how you find shippers, what to say to them, the cycle that turns a cold name into an account, and the follow-up discipline that separates brokers who build a book from brokers who wash out.</p>
      <div class="callout">The number that matters: a new shipper typically needs 6 to 10 touches over 60 to 90 days before the first load. Most new brokers quit after two. The ones who last are simply still calling when the shipper’s regular carrier falls off.</div>`},
    {h:"Who actually buys freight", html:`
      <p>The buyer is the person whose phone rings when a truck does not show up. Titles: logistics manager, transportation manager, shipping supervisor, traffic manager, plant manager at smaller plants. Not purchasing, not the CEO, not the receptionist.</p>
      <p>The sweet spot for a new broker is 20 to 200 loads a month: enough freight to be worth the work, small enough that they still answer their own phone and have no procurement department between you and them.</p>
      <p>What they care about, in order: the truck shows up, they hear about problems before their receiver does, the rate is fair, and the paperwork is clean. Price is fourth. Sell on the first three.</p>`},

      <tr><td>Metals service center</td><td>Coils, bars, plate, flatbed with tarps</td><td>Specialized equipment, frequent one-offs</td><td>Shipping supervisor</td></tr>
      <tr><td>Plastics or chemical manufacturer</td><td>Drums, totes, gaylords; van, some hazmat</td><td>Compliance headaches; pays for brokers who handle hazmat right</td><td>Logistics manager</td></tr>
      <tr><td>Regional retailer or e-commerce DC</td><td>Inbound van freight from vendors</td><td>Inbound is usually unmanaged; vendors ship collect</td><td>Inbound logistics or DC manager</td></tr></table></div>
      <p>Pick two of these verticals and go deep. A broker who knows the paper industry’s lanes, seasons and dock quirks wins against one who calls everyone.</p>`},
    {h:"Sourcing new clients", html:`
      <p class="lead">A prospect list is built, not bought. Target 50 qualified names in your first week on the desk and add 10 a week after that.</p>
      <ul>
        <li><strong>Data tools.</strong> ZoomInfo, LinkedIn Sales Navigator and industry directories, filtered by vertical, headcount and location. Export the logistics titles, not the executives.</li>
        <li><strong>Drive the industrial parks.</strong> Dock doors, trailers in the yard and a truck entrance mean freight. Note the company, look up the buyer, call that afternoon.</li>
        <li><strong>Ask your carriers.</strong> Every carrier you book hauls for other shippers. “Who else do you pick up from in that area?” is the best lead source in the industry and it is free.</li>
        <li><strong>Work the consignees.</strong> Every delivery address on your loads is a company that receives freight and probably ships some too. Call them.</li>
        <li><strong>Watch the load boards.</strong> Lanes posted repeatedly by other brokers reveal shippers with steady freight. Find the shipper behind the lane.</li>
        <li><strong>Trade shows and associations.</strong> State manufacturing associations, produce expos, building-products shows. Go as a member, not a vendor.</li>
        <li><strong>Lapsed and lost accounts.</strong> Vanir National’s TMS has shippers nobody has called in a year. Those are warm.</li>
        <li><strong>Referrals.</strong> After a load goes well, ask the shipper who else they know who moves freight. People in logistics know each other.</li>
      </ul>`},
    {h:"The sales cycle", html:`
      <div class="scroll"><table><tr><th>Stage</th><th>Goal</th><th>Typical time</th><th>Exit when</th></tr>
      <tr><td>1. Prospect</td><td>Qualified name, title, direct line</td><td>Day 0</td><td>You have a real decision-maker to call</td></tr>

    {h:"The first call", html:`
      <p><strong>Open</strong> with your name, Vanir National, and one sentence on why them specifically: their lanes, their commodity, a customer near them. Under 15 seconds.</p>
      <p><strong>Qualify</strong> with three questions: “Do you ship full truckload? Roughly how many loads a week? Who handles that for you today?”</p>
      <p><strong>Find the pain:</strong> “When a truck falls off at 4 p.m. on a Friday, who do you call?” “Which lane is the hardest to cover right now?” “What does your current broker do that drives you crazy?”</p>

      <p>Rules: never two emails in a row without a call between; always leave a voicemail with one specific reason to call back; a “no” means “not today” unless they tell you to stop. Then stop.</p>`},

COURSE.push({ id:"final", label:"Final exam", short:"Final", isFinal:true, slides:[{final:true}] });

// ---------- ENGINE ----------
const KEY="vanir-course-v1";
let state={quiz:{},lab:{},finalBest:null};
try{ const s=localStorage.getItem(KEY); if(s) state=Object.assign(state,JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

let cur={sec:0,slide:0};
const RESERVED=["settings","sidebar","customize","upgrade","downloads"];
function secFromHash(){ const h=(location.hash||"").replace("#",""); let i=COURSE.findIndex(s=>s.id===h); if(i<0) i=0; if(!unlocked(i)) i=Math.max(0,firstLocked()-1); return i; }

function totalSlides(sec){ return sec.slides.length + (sec.quiz?1:0); }
const PASS=85, DRAW=8;
function quizPassed(id){ const q=state.quiz[id]; return q && q.pct>=PASS; }
function unlocked(i){ for(let k=0;k<i;k++){ if(COURSE[k].quiz && !quizPassed(COURSE[k].id)) return false; } return true; }
function firstLocked(){ for(let k=0;k<COURSE.length;k++){ if(!unlocked(k)) return k; } return COURSE.length; }
function allQuizzesPassed(){ return COURSE.filter(s=>s.quiz).every(s=>quizPassed(s.id)); }

const $=id=>document.getElementById(id);

function renderNav(){
  const nav=$("nav"); nav.innerHTML="";
  COURSE.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className=i===cur.sec?"active":"";
    let tag="";
    const lock=!unlocked(i);
    if(s.quiz){ const q=state.quiz[s.id]; if(q) tag=`<span class="tag ${q.pct>=PASS?"pass":"fail"}">${q.pct}%</span>`; else if(lock) tag=`<span class="tag">Locked</span>`; }
    if(s.isFinal){ if(state.finalBest!=null) tag=`<span class="tag ${state.finalBest>=85?"pass":"fail"}">${state.finalBest}%</span>`; else if(!allQuizzesPassed()) tag=`<span class="tag">Locked</span>`; }
    b.innerHTML=`<span class="day-n">${s.day||(s.isFinal?"✓":"•")}</span><span>${s.label}</span>${tag}`;
    if(lock){ b.disabled=true; b.classList.add("locked"); }
    b.onclick=()=>{ go(i,0); closeRail(); };
    nav.appendChild(b);
  });
}

function go(sec,slide){
  if(!unlocked(sec)) return;
  cur={sec,slide};
  if(!RESERVED.includes(COURSE[sec].id)) history.replaceState(null,"","#"+COURSE[sec].id);
  render();
}

function render(){
  const sec=COURSE[cur.sec]; const n=totalSlides(sec);
  renderNav();
  $("where").textContent=sec.label;
  $("counter").textContent=`${cur.slide+1} / ${n}`;
  const dots=$("dots"); dots.innerHTML="";
  for(let i=0;i<n;i++){ const d=document.createElement("i"); if(i===cur.slide) d.className="on"; else if(i<cur.slide) d.className="done"; dots.appendChild(d); }
  $("prevBtn").disabled = cur.sec===0 && cur.slide===0;
  const last = cur.sec===COURSE.length-1 && cur.slide===n-1;
  const blocked = cur.slide===n-1 && sec.quiz && !quizPassed(sec.id);
  $("nextBtn").textContent = cur.slide===n-1 ? (last?"Finish":(blocked?"Pass the quiz to continue":"Next day")) : "Next";
  $("nextBtn").disabled = last || blocked;

  const el=$("slide");
  if(sec.quiz && cur.slide===sec.slides.length){ renderQuiz(sec,el); }
  else { const s=sec.slides[cur.slide];
    if(s.lab!==undefined) renderLab(s.lab,el);
    else if(s.final) renderFinal(el);
    else { el.innerHTML=(s.k?`<div class="kicker">${s.k}</div>`:"")+`<h2>${s.h}</h2>`+s.html; if(sec.id==="day3" && el.querySelector("#labDebrief")) labDebrief(); }
  }
  $("stage").scrollTop=0;
}

function next(){ const sec=COURSE[cur.sec]; if(cur.slide<totalSlides(sec)-1) go(cur.sec,cur.slide+1); else if(cur.sec<COURSE.length-1 && !(sec.quiz&&!quizPassed(sec.id))) go(cur.sec+1,0); }
function prev(){ if(cur.slide>0) go(cur.sec,cur.slide-1); else if(cur.sec>0){ const p=cur.sec-1; go(p,totalSlides(COURSE[p])-1); } }

// ---- quiz ----
function renderQuestions(container,questions,picks,graded){
  container.innerHTML="";
  questions.forEach((q,i)=>{
    const d=document.createElement("div"); d.className="q";
    let opts=q.o.map((o,j)=>{
      let cls="opt"; if(picks[i]===j) cls+=" sel";
      if(graded){ if(j===q.a) cls+=" right"; else if(picks[i]===j) cls+=" wrong"; }
      return `<button class="${cls}" data-q="${i}" data-o="${j}" ${graded?"disabled":""}><span class="k">${"ABCD"[j]}</span><span>${o}</span></button>`;
    }).join("");
    d.innerHTML=`<div class="qn">Question ${i+1} of ${questions.length}</div><div class="qt">${q.q}</div><div class="opts">${opts}</div>`+(graded&&q.e?`<div class="exp">${q.e}</div>`:"");
    container.appendChild(d);
  });
}

const drawn={};
function drawQuestions(sec){
  const pool=sec.quiz.map((q,i)=>i); const prev=state.lastDraw&&state.lastDraw[sec.id]||[];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const fresh=pool.filter(i=>!prev.includes(i)); const pick=fresh.slice(0,DRAW); let k=0;
  while(pick.length<DRAW){ const c=pool.find(i=>!pick.includes(i)); if(c===undefined) break; pick.push(c); }
  state.lastDraw=state.lastDraw||{}; state.lastDraw[sec.id]=pick; save();
  return pick.map(i=>sec.quiz[i]);
}
function renderQuiz(sec,el){
  const prevR=state.quiz[sec.id];
  if(!drawn[sec.id]) drawn[sec.id]=drawQuestions(sec);
  const QS=drawn[sec.id];
  el.innerHTML=`<div class="kicker">Day ${sec.day} quiz</div><h2>Check your understanding</h2>
    <p class="lead">${QS.length} questions drawn from a pool of ${sec.quiz.length}. You need ${PASS}% to unlock the next day. Answers are explained after you submit; a retake draws a different set.</p>
    ${prevR?`<div class="score ${prevR.pct>=PASS?"pass":"fail"}"><div class="big">${prevR.pct}%</div><div>Your best so far: ${prevR.right} of ${prevR.of}. ${prevR.pct>=PASS?"Passed. The next day is unlocked.":"Not yet passed. A new set of questions is below."}</div></div>`:""}
    <div id="qs"></div><button class="btn" id="submitQ">Submit answers</button>`;
  let picks={}, graded=false;
  const qs=$("qs");
  const paint=()=>renderQuestions(qs,QS,picks,graded);
  paint();
  qs.onclick=e=>{ const b=e.target.closest(".opt"); if(!b||graded) return; picks[+b.dataset.q]=+b.dataset.o; paint(); };
  $("submitQ").onclick=()=>{
    if(Object.keys(picks).length<QS.length){ alert("Answer every question before submitting."); return; }
    graded=true; paint();
    let right=QS.filter((q,i)=>picks[i]===q.a).length; const pct=Math.round(right/QS.length*100);
    if(!prevR||pct>prevR.pct) state.quiz[sec.id]={right,pct,of:QS.length}; save();
    delete drawn[sec.id];
    const sc=document.createElement("div"); sc.className="score "+(pct>=PASS?"pass":"fail");
    sc.innerHTML=`<div class="big">${pct}%</div><div>${right} of ${QS.length} correct. ${pct>=PASS?"Day "+sec.day+" passed. The next day is unlocked.":"Below "+PASS+"%. Review the explanations and the slides, then retake with a new set of questions."}</div>`;
    const btn=$("submitQ"); btn.replaceWith(sc);
    if(pct<PASS){ const re=document.createElement("button"); re.className="btn ghost"; re.textContent="Retake with new questions"; re.onclick=()=>render(); sc.after(re); }
    renderNav(); render.lastPct=pct; $("stage").scrollTop=0;
  };
}

        <div class="pcell"><div class="lab">Caller’s email</div><div class="val">${c.callerEmail}</div></div>
        <div class="pcell"><div class="lab">Auto liability</div><div class="val">${c.autoLiab}</div></div>
        <div class="pcell"><div class="lab">Cargo coverage</div><div class="val${flag(c.cargo)}">${c.cargo}</div></div>
        <div class="pcell"><div class="lab">Insurer</div><div class="val">${c.insurer}</div></div>
        <div class="pcell"><div class="lab">Policy dates</div><div class="val${flag(c.insEff)}">${c.insEff}</div></div>

        <div class="pcell wide"><div class="lab">FreightGuard reports (${c.fg.length})</div>${fgHtml}</div>
      </div>
      <div class="decide"><span style="font-weight:600;margin-right:6px">Your decision:</span>
        <button class="btn approve ${prev==="approve"?"chosen":""}" data-d="approve" ${prev?"disabled":""}>Approve</button>
        <button class="btn decline ${prev==="decline"?"chosen":""}" data-d="decline" ${prev?"disabled":""}>Decline</button></div>
      <div class="verdict" id="verdict"></div>
      <div class="mock">Fictional carrier profile for training. Layout mirrors a typical vetting report; names, numbers and incidents are invented.</div>
    </div>`;
  const show=(d)=>{ const ok=d===c.answer; $("verdict").innerHTML=`<div class="callout ${ok?"good":"bad"}"><strong>${ok?"Correct.":"Not correct."}</strong> The right call is <strong>${c.answer}</strong>. ${c.why}</div>`; };
  if(prev) show(prev);
  el.querySelector(".decide").onclick=e=>{ const b=e.target.closest("button"); if(!b||state.lab[c.mc]) return; const d=b.dataset.d; state.lab[c.mc]=d; save(); el.querySelectorAll(".decide .btn").forEach(x=>{ x.classList.toggle("chosen",x.dataset.d===d); x.disabled=true; }); show(d); };
}
function labDebrief(){
  const rows=CARRIERS.map(c=>{ const p=state.lab[c.mc]; const ok=p===c.answer; return `<tr><td>${c.name}</td><td>${c.answer}</td><td>${p||"not answered"}</td><td style="color:${p?(ok?"var(--green)":"var(--red)"):"var(--muted)"};font-weight:600">${p?(ok?"Correct":"Missed"):"—"}</td></tr>`; }).join("");
  const right=CARRIERS.filter(c=>state.lab[c.mc]===c.answer).length;
  $("labDebrief").innerHTML=`<p class="lead">You got ${right} of ${CARRIERS.length} carriers right. Your trainer will want to see 7 of 7 before load board access.</p>
    <table><tr><th>Carrier</th><th>Right call</th><th>Your call</th><th></th></tr>${rows}</table>`;
}

// ---- final ----
function renderFinal(el){
  if(!allQuizzesPassed()){
    const missing=COURSE.filter(s=>s.quiz&&!quizPassed(s.id)).map(s=>"Day "+s.day).join(", ");
    el.innerHTML=`<div class="kicker">Final exam</div><h2>Locked until every daily quiz is passed</h2><p class="lead">Still to pass: ${missing}. Each needs ${PASS}%.</p>`; return;
  }
  el.innerHTML=`<div class="kicker">Final exam</div><h2>34 questions, 85% to graduate</h2>
    <p class="lead">Everything from the week. Fraud and vetting questions are weighted heaviest. Take your time; there is no clock.</p>
    ${state.finalBest!=null?`<div class="score ${state.finalBest>=85?"pass":"fail"}"><div class="big">${state.finalBest}%</div><div>Your best score. ${state.finalBest>=85?"You have passed the final. Show this screen to your trainer.":"Not yet passed."}</div></div>`:""}
    <div id="qs"></div><button class="btn" id="submitF">Submit exam</button>`;
  let picks={}, graded=false; const qs=$("qs");
  const paint=()=>renderQuestions(qs,FINAL,picks,graded); paint();
  qs.onclick=e=>{ const b=e.target.closest(".opt"); if(!b||graded) return; picks[+b.dataset.q]=+b.dataset.o; paint(); };
  $("submitF").onclick=()=>{
    if(Object.keys(picks).length<FINAL.length){ alert(`Answer all ${FINAL.length} questions before submitting.`); return; }
    graded=true; paint();
    const right=FINAL.filter((q,i)=>picks[i]===q.a).length; const pct=Math.round(right/FINAL.length*100);
    if(state.finalBest==null||pct>state.finalBest) state.finalBest=pct; save();
    const sc=document.createElement("div"); sc.className="score "+(pct>=85?"pass":"fail");
    sc.innerHTML=`<div class="big">${pct}%</div><div>${right} of ${FINAL.length} correct. ${pct>=85?"You passed. Screenshot this page and send it to your trainer. Welcome to the desk.":"Below 85%. Correct answers are highlighted above. Review the weak days and retake."}</div>`;
    const btn=$("submitF"); btn.replaceWith(sc);
    const re=document.createElement("button"); re.className="btn ghost"; re.textContent="Retake exam"; re.onclick=()=>render(); sc.after(re);
    renderNav(); $("stage").scrollTop=0;
  };
}

// ---- wiring ----
$("nextBtn").onclick=next; $("prevBtn").onclick=prev;
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.key==="ArrowRight") next(); if(e.key==="ArrowLeft") prev(); });
function closeRail(){ $("rail").classList.remove("open"); $("scrim").classList.remove("open"); }
$("menuBtn").onclick=()=>{ $("rail").classList.toggle("open"); $("scrim").classList.toggle("open"); };
$("scrim").onclick=closeRail;
$("resetBtn").onclick=()=>{ if(confirm("Erase all quiz, lab and exam progress in this browser?")){ state={quiz:{},lab:{},finalBest:null}; save(); for(const k in drawn) delete drawn[k]; go(0,0); } };
window.addEventListener("hashchange",()=>{ const s=secFromHash(); if(s!==cur.sec) go(s,0); });
go(secFromHash(),0);
</script>
</body>
</html>
